services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: smart-health-api
    restart: always
    env_file:
      - .env
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: smart-health-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  ai-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m app.workers.ai_worker
    env_file:
      - .env
    depends_on:
      - redis

feat: redesign SMS pipeline with 200 TPS dispatcher, late-subscriber catch, and retry logic

OVERVIEW
--------
Replaced the per-subscriber RQ queue dispatch model with a centralised,
DB-driven pipeline that separates tip generation from delivery. SMS sending
now happens at a controlled 200 TPS using true round-robin across all
configured SMS ports, with automatic retry on port failure.

MOTIVATION
----------
The previous architecture enqueued one RQ task per subscriber and relied on
multiple sms-worker processes to send — giving no control over throughput,
no guaranteed send time, and no way to catch subscribers who joined after
the scheduler ran. Failed sends had no structured retry tied to the send
window.

NEW PIPELINE (runs twice daily: 07:00 and 19:00)
-------------------------------------------------
06:00 / 18:00  prefetch_pool_job
  - One OpenAI batch call generates 10 sw + 10 en generic tips.
  - Cached in Redis (14h TTL) so no-history subscribers are served
    without individual API calls.

06:10 / 18:10  prepare_all_tips_job  (app/tasks/generation_tasks.py)
  - Fetches all active subscribers and their recent chat history.
  - Enqueues process_profile() to ai_generation_queue for each subscriber.
  - AI workers run in parallel over the next ~45 minutes:
      • has chat history  → classify topics + generate personalised tip
      • no chat history   → random tip from Redis pool
  - Tips stored as delivery_status='ready' in smart_tips.generated_tips.
  - Each processed msisdn is added to a Redis window-set
    (key: smart_tips:dispatch_window:YYYYMMDD_HHMM, TTL 4h) so the
    late-subscriber catch knows who has already been handled.

06:55 / 18:55  prepare_late_subscribers_job  (app/tasks/generation_tasks.py)
  - Re-queries the full active subscriber list.
  - Any msisdn NOT present in the Redis window-set is a new subscriber
    who joined after the main prepare job ran (e.g. joined at 18:51 for
    the 19:00 window). These are enqueued and processed immediately.
  - Ensures no subscriber is silently missed regardless of when they
    became active.

07:00 / 19:00  dispatch_tips_job  (app/tasks/dispatch_tasks.py)
  - SELECT id, msisdn, language, generated_tip FROM smart_tips.generated_tips
    WHERE delivery_status='ready' AND created_at >= NOW() - INTERVAL '3 hours'
  - Sends all tips at SMS_TPS (default 200) transactions per second.
  - True round-robin: port_index advances by 1 per subscriber so load is
    evenly distributed across all configured SMS ports (6016, 6017, 6018).
  - Per-port failover: if the assigned port is unavailable, the next port
    in order is tried before marking the tip as failed.
  - port_index always advances even on failure, preserving round-robin
    fairness across the full batch.
  - Outcome written back to DB: delivery_status = 'sent' or 'failed'.

07:15 & 07:30 / 19:15 & 19:30  retry_failed_tips_job
  - Queries delivery_status='failed' AND retry_count < MAX_RETRIES (2)
    within the last 2 hours.
  - Runs the same _send_tips() loop as the dispatch job.
  - Success  → delivery_status = 'sent'
  - Failure  → retry_count += 1  (stays 'failed' for next retry pass)
  - After retry_count reaches MAX_RETRIES the tip is permanently abandoned.
  - Total attempts per tip: 1 initial dispatch + 2 retries = 3 maximum.

CHANGES BY FILE
---------------
app/tasks/generation_tasks.py  [NEW]
  - prepare_all_tips(): enqueues all active subscribers, marks each in
    Redis window-set before enqueuing to prevent late-catch double-processing.
  - prepare_late_subscribers(): diffs current subscriber list against the
    Redis window-set and processes only the delta (new subscribers).
  - _get_window_key(): derives the correct Redis key based on current
    local time (morning = _0700, evening = _1900).

app/tasks/dispatch_tasks.py  [NEW]
  - _send_tips(tips, label): shared core send loop used by both dispatch
    and retry. Handles TPS rate limiting, round-robin port assignment,
    per-port failover, and sms_log insertion for every attempt.
  - dispatch_all_ready_tips(): fetches 'ready' tips, calls _send_tips(),
    updates delivery_status to 'sent' or 'failed'.
  - retry_failed_tips(): fetches eligible 'failed' tips, calls _send_tips(),
    marks 'sent' on success or increments retry_count on failure.
  - MAX_RETRIES = 2 constant controls abandonment threshold.

app/database/generated_tips.py
  - fetch_ready_tips(): SELECT delivery_status='ready', created last 3h.
  - fetch_failed_tips(max_retries, window_hours): SELECT delivery_status=
    'failed' AND retry_count < max_retries within the time window.
  - update_delivery_status(tip_id, status): UPDATE single tip after dispatch.
  - increment_retry_count(tip_id): UPDATE retry_count += 1 on retry failure,
    preserving delivery_status='failed' for subsequent retry passes.

app/tasks/ai_tasks.py
  - Removed import of sms_queue and traceback (no longer used).
  - Renamed _validate_and_dispatch() → _validate_and_store().
  - Tips are now stored with delivery_status='ready' instead of 'queued'.
  - Removed sms_queue.enqueue() call; the dispatch job reads from DB directly.

app/scheduler/jobs.py
  - Replaced single process_smart_tips_job() with four focused job functions:
    prefetch_pool_job, prepare_all_tips_job, prepare_late_subscribers_job,
    dispatch_tips_job, retry_failed_tips_job.

app/scheduler/scheduler.py
  - Replaced 2-job schedule with 8-job pipeline (4 per send window).
  - Morning: 06:00, 06:10, 06:55, 07:00, 07:15, 07:30
  - Evening: 18:00, 18:10, 18:55, 19:00, 19:15, 19:30

docker-compose.yml
  - Removed sms-worker and retry-worker services. Both listened to queues
    (sms_dispatch_queue, retry_queue) that are no longer populated.
    SMS dispatch and retry are now handled entirely within the scheduler
    process via direct HTTP calls to the SMS gateway.

DELIVERY STATUS LIFECYCLE
--------------------------
  ready    → tip prepared by AI worker, awaiting dispatch job
  sent     → successfully delivered via SMS gateway
  failed   → all ports unavailable; eligible for retry if retry_count < 2
  duplicate→ tip hash matched a recent send for same msisdn; skipped
  skipped  → other skip reason (e.g. validation failure with no fallback)

